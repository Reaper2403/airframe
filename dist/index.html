<body>
  <a href="#app" class="skip-link">Skip to investigation content</a>
  <header class="app-header">

    <nav class="app-nav" aria-label="Main navigation"><a id="factory-nav" href="#factory">Factory</a><a id="investigate-nav" href="#investigate/AF-104">Investigate</a></nav>
